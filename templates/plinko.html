<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko - Antaria Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; overflow-x: hidden; }
        .peg { width: 8px; height: 8px; background: #475569; border-radius: 50%; position: absolute; }
        .ball { width: 12px; height: 12px; background: #fff; border-radius: 50%; position: absolute; box-shadow: 0 0 10px rgba(255,255,255,0.5); z-index: 20; }
        .multiplier-slot { transition: all 0.2s; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 flex flex-col">
    <nav class="border-b border-white/5 bg-slate-900/50 p-4 flex justify-between items-center">
        <a href="/" class="text-slate-400 hover:text-white font-bold uppercase tracking-widest text-xs">← Back</a>
        <div class="bg-slate-950 px-4 py-2 rounded-full border border-white/10 text-emerald-400 font-mono font-bold" id="balance">$0.00</div>
    </nav>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="bg-slate-900 p-6 rounded-[2rem] border border-white/5 space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Bet Amount</label>
                <input type="number" id="bet-amount" value="10" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 font-mono text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Risk</label>
                <select id="risk" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <button id="drop-btn" onclick="dropBall()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-emerald-500/20 transition-all">
                DROP BALL
            </button>
        </div>

        <div class="lg:col-span-3 bg-slate-900 rounded-[2.5rem] border border-white/5 relative overflow-hidden flex flex-col items-center justify-end pb-12 min-h-[600px]">
            <div id="plinko-board" class="relative w-full max-w-[600px] aspect-[4/5] mb-8">
                <!-- Pegs and slots will be injected here -->
            </div>
            <div id="multiplier-row" class="flex gap-1 px-4 w-full max-w-[600px]">
                <!-- Multipliers will be injected here -->
            </div>
        </div>
    </main>

    <script>
        const board = document.getElementById('plinko-board');
        const multRow = document.getElementById('multiplier-row');
        const rows = 12;
        const multipliers = [33, 11, 4, 2, 1.1, 0.6, 0.3, 0.6, 1.1, 2, 4, 11, 33];
        
        function initBoard() {
            board.innerHTML = '';
            multRow.innerHTML = '';
            
            for(let r = 0; r < rows; r++) {
                const cols = r + 3;
                for(let c = 0; c < cols; c++) {
                    const peg = document.createElement('div');
                    peg.className = 'peg';
                    peg.style.top = `${(r / rows) * 100}%`;
                    peg.style.left = `${(c / (cols - 1)) * 100}%`;
                    board.appendChild(peg);
                }
            }
            
            multipliers.forEach(m => {
                const slot = document.createElement('div');
                slot.className = 'flex-1 bg-slate-800 rounded-lg py-2 text-center text-[10px] font-bold multiplier-slot';
                slot.textContent = m + 'x';
                multRow.appendChild(slot);
            });
        }

        async function dropBall() {
            const bet = parseFloat(document.getElementById('bet-amount').value);
            const dropBtn = document.getElementById('drop-btn');
            dropBtn.disabled = true;
            
            const res = await fetch('/api/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ game: 'plinko', bet })
            });
            
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.style.top = '0%';
            ball.style.left = '50%';
            board.appendChild(ball);
            
            let currentLeft = 50;
            for(let r = 0; r < rows; r++) {
                await new Promise(res => setTimeout(res, 150));
                const direction = Math.random() > 0.5 ? 1 : -1;
                currentLeft += direction * (50 / (r + 3));
                ball.style.top = `${((r + 1) / rows) * 100}%`;
                ball.style.left = `${currentLeft}%`;
            }
            
            setTimeout(() => {
                ball.remove();
                dropBtn.disabled = false;
                updateBalance();
            }, 500);
        }

        async function updateBalance() {
            const res = await fetch('/api/user');
            const data = await res.json();
            document.getElementById('balance').textContent = '$' + data.balance.toFixed(2);
        }

        initBoard();
        updateBalance();
    </script>
</body>
</html>
